# config.yaml - EfficientNetB0 + SVM pipeline (Optimized for small dataset)
general:
  seed: 42
  image_size: 224
  batch_size: 16  # Reduced for small dataset stability
  num_workers: 4  # Reduced for smaller dataset
  dataset_dir: "images/enhanced"
  augments_dir: "images/augments"
  outputs_dir: "models/outputs"
  timestamp_format: "%Y%m%d%H%M%S"

splits:
  train_frac: 0.75  # Increased training data
  val_frac: 0.15    # Reduced validation
  test_frac: 0.10
  stratify_by: "class"
  random_seed: 42

augmentation:
  enable_augmentation: true
  per_class_target: 800  # More reasonable target for 1500 total images
  max_aug_per_source: 8  # Increased since we have fewer source images
  albumentations:
    brightness_contrast:
      enabled: true
      brightness_limit: 0.3  # Increased variation
      contrast_limit: 0.3
      p: 0.7  # Higher probability
    gaussian_blur:
      enabled: true
      blur_limit: 7  # Increased for more variation
      p: 0.4
    motion_blur:  # Added new augmentation
      enabled: true
      blur_limit: 7
      p: 0.3
    random_gamma:  # Added new augmentation
      enabled: true
      gamma_limit: (80, 120)
      p: 0.3
    hue_saturation_value:  # Added color variation
      enabled: true
      hue_shift_limit: 20
      sat_shift_limit: 30
      val_shift_limit: 20
      p: 0.5
    shift_scale_rotate:  # Combined transformation
      enabled: true
      shift_limit: 0.1
      scale_limit: 0.2
      rotate_limit: 30
      p: 0.5
    cutout:  # Regularization technique
      enabled: true
      max_h_size: 20
      max_w_size: 20
      num_holes: 8
      p: 0.5
    rotation:
      enabled: true
      limit: 35  # Increased rotation
      p: 0.6
    resize:
      always_apply: true
      height: 224
      width: 224

  keras_augment:
    horizontal_flip: true
    vertical_flip: true
    rotation_range: 30  # Increased
    width_shift_range: 0.1  # Added shift
    height_shift_range: 0.1
    shear_range: 0.1    # Added shear
    zoom_range: 0.2     # Added zoom
    brightness_range: [0.8, 1.2]  # Added brightness
    channel_shift_range: 0.1  # Added color shift

preprocessing:
  rescale: 1./255
  mean: [0.485, 0.456, 0.406]  # ImageNet mean
  std: [0.229, 0.224, 0.225]   # ImageNet std
  normalize_method: "imagenet"  # Use ImageNet normalization

model:
  efficientnet:
    weights_url: "https://storage.googleapis.com/keras-applications/efficientnetb0_notop.h5"
    include_top: false
    pooling: "avg"
    base_weights: "imagenet"
    unfreeze_top_n_layers: 30  # Slightly more conservative unfreezing
    fine_tune:
      enabled: true
      epochs: 25  # More epochs for small dataset
      batch_size: 16  # Match general batch_size
      learning_rate: 5e-5  # Slightly higher LR for small dataset
      optimizer: "adam"
      early_stopping:
        monitor: "val_accuracy"
        patience: 5  # More patience for small dataset
        restore_best_weights: true
      reduce_lr:
        monitor: "val_loss"
        factor: 0.5
        patience: 3  # More patience
        min_lr: 1e-7
      class_weights: "balanced"  # Important for imbalanced small datasets

feature_extraction:
  cache_features: true
  features_filename: "features_{split}.npz"
  pooling: "avg"
  flatten_map: false  # Keep as false to use 1280-dim features (better for SVM)

svm:
  scale_features: true
  scaler: "StandardScaler"
  grid_search:
    enabled: true
    cv: 3  # Reduced CV folds for faster search with small dataset
    n_jobs: -1
    param_grid:
      C: [0.01, 0.1, 1, 10, 100]  # Wider range including smaller C values
      kernel: ["rbf", "linear"]
      gamma: ["scale", "auto", 0.001, 0.01]
  final:
    kernel: "rbf"
    C: 1.0  # More conservative default
    gamma: "scale"
    probability: true
    class_weight: "balanced"

analysis:
  save_history_plot: true
  save_confusion_matrix: true
  save_partition_pie: true
  save_class_distribution_before_after: true
  save_feature_visualization: true  # New: visualize feature space
  save_learning_curves: true        # New: detailed learning curves
  results_json: "analysis/results.json"

output_structure:
  create_subfolders:
    - analysis
    - false_predictions
    - weights
    - logs
    - predictions

logging:
  level: "INFO"
  save_logs: true
  log_frequency: 10  # Log every 10 batches

cross_validation:  # New section for small dataset validation
  enable_cv: false  # Can enable for final evaluation
  n_folds: 5
  cv_strategy: "stratified"