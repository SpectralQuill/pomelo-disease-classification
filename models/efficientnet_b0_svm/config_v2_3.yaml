# config.yaml - EfficientNetB0 + SVM Hybrid Pipeline
general:
  seed: 42
  image_size: 224
  batch_size: 8
  dataset_dir: "images/enhanced"
  augments_dir: "images/augments"
  outputs_dir: "models/outputs"
  timestamp_format: "%Y%m%d%H%M%S"

splits:
  train_frac: 0.75
  val_frac: 0.15
  test_frac: 0.10
  stratify_by: "class"
  random_seed: 42

augmentation:
  enable_augmentation: true
  per_class_target: 1500
  max_aug_per_source: 10
  albumentations:
    brightness_contrast:
      enabled: true
      brightness_limit: 0.3
      contrast_limit: 0.3
      p: 0.7
    gaussian_blur:
      enabled: true
      blur_limit: 7
      p: 0.4
  keras_augment:
    horizontal_flip: true
    vertical_flip: true
    rotation_range: 35
    width_shift_range: 0.05
    height_shift_range: 0.05
    shear_range: 5
    zoom_range: 0.1
    fill_mode: "nearest"

model:
  efficientnet:
    weights_url: "https://storage.googleapis.com/keras-applications/efficientnetb0_notop.h5"
    unfreeze_top_n_layers: 75
    fine_tune:
      enabled: true
      epochs: 40
      batch_size: 8
      learning_rate: 1e-4
      fine_tune_epochs: 25
      fine_tune_learning_rate: 1e-5
      optimizer: "adam"
      class_weights: "balanced"
      early_stopping:
        monitor: "val_loss"
        patience: 6
        restore_best_weights: true
      reduce_lr:
        monitor: "val_loss"
        factor: 0.5
        patience: 3
        min_lr: 1e-7

feature_extraction:
  cache_features: true
  features_filename: "features_{split}.npz"
  flatten_map: false

svm:
  scale_features: true
  scaler: "StandardScaler"
  grid_search:
    enabled: true
    cv: 5
    n_jobs: -1
    param_grid:
      # C: [0.01, 0.1, 1, 10, 100]
      C: [5, 10]
      # kernel: ["rbf", "linear"]
      kernel: ["rbf"]
      # gamma: ["scale", "auto", 0.001, 0.01]
      gamma: ["auto", "scale"]
  final:
    kernel: "rbf"
    C: 1.0
    gamma: "scale"
    probability: true
    class_weight: "balanced"

analysis:
  save_history_plot: true
  save_confusion_matrix: true
  save_partition_pie: true
  save_class_distribution_before_after: true

logging:
  level: "INFO"
