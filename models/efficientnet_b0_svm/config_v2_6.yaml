# config.yaml - EfficientNetB0 + SVM Hybrid Pipeline
general:
  seed: 42
  image_size: 224
  batch_size: 8
  dataset_dir: "images/enhanced"
  augments_dir: "images/augments"
  outputs_dir: "models/outputs"
  timestamp_format: "%Y%m%d%H%M%S"

splits:
  train_frac: 0.75
  val_frac: 0.15
  test_frac: 0.10
  stratify_by: "class"
  random_seed: 42

augmentation:
  enable_augmentation: true
  per_class_target: 1000
  max_aug_per_source: 7
  albumentations:
    brightness_contrast:
      enabled: true
      brightness_limit: 0.1
      contrast_limit: 0.1
      p: 0.6
    hue_saturation:
      enabled: true
      hue_shift_limit: 8
      sat_shift_limit: 20
      val_shift_limit: 8
      p: 0.5
    clahe:
      enabled: false
      clip_limit: 3.0
      tile_grid_size: [6, 6]
      p: 0.4
    gaussian_blur:
      enabled: true
      blur_limit: [1, 3]
      p: 0.2
    gauss_noise:
      enabled: false
      var_limit: [5.0, 15.0]
      p: 0.1
    sharpen:
      enabled: false
      alpha: [0.15, 0.35]
      lightness: [0.9, 1.2]
      p: 0.4
    rotation:
      enabled: true
      limit: 10
      p: 0.5
    flip:
      enabled: true
      p: 0.5
    shift_scale:
      enabled: false
      shift_limit: 0.02
      scale_limit: 0.04
      p: 0.2
    rgb_shift:
      enabled: true
      r_shift_limit: 8
      g_shift_limit: 8
      b_shift_limit: 8
      p: 0.3
    multiplicative_noise:
      enabled: false
      shift_limit: [0.9, 1.1]
      p: 0.2
    random_gamma:
      enabled: true
      gamma_limit: [90, 110]
      p: 0.3

model:
  efficientnet:
    weights_url: "https://storage.googleapis.com/keras-applications/efficientnetb0_notop.h5"
    fine_tune:
      data_loading_mode: "preload"       # or "stream" for lower RAM usage
      enabled: true
      epochs: 60
      batch_size: 8
      learning_rate: 1e-5
      class_weights: "balanced"
      early_stopping:
        monitor: "val_accuracy"
        patience: 5
        restore_best_weights: true
      reduce_lr:
        monitor: "val_loss"
        factor: 0.5
        patience: 4
        min_lr: 1e-7
      unfreeze_stages:
        - layers_to_unfreeze: 30
          epochs: 5
          learning_rate: 1e-5
        - layers_to_unfreeze: 60
          epochs: 8
          learning_rate: 5e-6
        - layers_to_unfreeze: 120
          epochs: 10
          learning_rate: 1e-6


feature_extraction:
  cache_features: true
  features_filename: "features_{split}.npz"
  flatten_map: false

svm:
  scale_features: true
  scaler: "StandardScaler"
  grid_search:
    enabled: true
    cv: 5
    n_jobs: -1
    param_grid:
      # C: [0.01, 0.1, 1, 10, 100]
      C: [5, 10]
      # kernel: ["rbf", "linear"]
      kernel: ["rbf"]
      # gamma: ["scale", "auto", 0.001, 0.01]
      gamma: ["auto", "scale"]
  final:
    kernel: "rbf"
    C: 1.0
    gamma: "scale"
    probability: true
    class_weight: "balanced"

analysis:
  save_history_plot: true
  save_confusion_matrix: true
  save_partition_pie: true
  save_class_distribution_before_after: true

logging:
  level: "INFO"
