# config.yaml - recommended defaults
seed: 42

# directories
dataset_dir: "images/enhanced"        # path to your preprocessed CLAHE dataset (class/infraclass/... structure)
outputs_dir: "models/outputs"         # root outputs folder where per-run folders are created

# dataset split
val_pct: 0.15
test_pct: 0.10

# augmentation settings
target_images_per_class: 900    # default target per class; will be clamped to at least the largest class size
augment_boost: 0.3

image_size: [224, 224]

augmentations:
  random_rotate: true
  rotate_limit: 60
  rotate_p: 0.7
  flip: true
  hflip_p: 0.5
  vflip_p: 0.5
  brightness_contrast: true
  brightness_p: 0.5
  hue_sat: true
  hsv_p: 0.3
  rgb_shift: true
  rgb_p: 0.2
  gamma: true
  gamma_p: 0.2
  blur: false
  blur_p: 0.1

# model base weights (use 'imagenet' or path to weights file)
base_weights: "models/base/efficientnetb0_notop.h5"

# classification head
head_units: 512
dropout: 0.4
l2: 1e-4

# fine-tuning phases - list of phases
# unfreeze_last_n: number of layers (from the end) to unfreeze for this phase. 0 -> fully frozen base.
finetune_phases:
  - name: "initial"
    unfreeze_last_n: 0
    epochs: 5
    lr: 1e-4
    monitor: "loss"
    batch_size: 8
    earlystop_patience: 4
    reduce_lr_factor: 0.5
    reduce_lr_patience: 3
  - name: "1"
    unfreeze_last_n: 30
    epochs: 20
    lr: 1e-5
    monitor: "val_accuracy"
    batch_size: 16
    earlystop_patience: 4
    reduce_lr_factor: 0.5
    reduce_lr_patience: 3
  - name: "2"
    unfreeze_last_n: 60
    epochs: 30
    lr: 5e-6
    monitor: "val_accuracy"
    batch_size: 16
    earlystop_patience: 5
    reduce_lr_factor: 0.5
    reduce_lr_patience: 3
  - name: "3"
    unfreeze_last_n: 120
    epochs: 20
    lr: 1e-6
    monitor: "val_loss"
    batch_size: 8
    earlystop_patience: 5
    reduce_lr_factor: 0.5
    reduce_lr_patience: 3

# SVM settings
svm:
  cv: 3
  n_jobs: 1
  param_grid:
    C: [0.1, 1, 10]
    kernel: ["rbf"]
    gamma: ["scale", "auto"]
  class_weight: null

# optional SVM pruning (feature selection)
svm_prune: true
prune_C: 0.01
prune_max_features: null

# logging and outputs (optional)
save_intermediate_feature_extractors: true
